name: Patch SystemUI.apk

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'a21s'

      - name: Install Tools & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget patch
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Download SystemUI.apk (Direct Link)
        run: |
          wget -O SystemUI.apk "https://file2linkbot-d0275d9b4683.herokuapp.com/dl/6ad8dc9662c1e21ac4b11283"

      - name: Decompile without Decoding Resources (-r)
        run: |
          # Using -r completely bypasses all resource decoding and aapt2 XML errors
          apktool d -f -r SystemUI.apk -o decompiled_ui

      - name: Apply New Left Cutout Smali Patch
